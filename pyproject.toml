[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosai"
version = "0.1.0"
description = "ChaosPilot: cloud-native resilience experiments"
requires-python = ">=3.11"
dependencies = [
  "google-genai", "pydantic>=2", "httpx", "docker", "pyyaml", "jinja2",
  "typer", "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
chaosai = "chaosai.cli:app"

[tool.setuptools.packages.find]
include = ["chaosai*"]

[tool.setuptools.package-data]
chaosai = ["fixtures/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tests/.tmp"
markers = ["integration: requires Docker or a running target (human-run only)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
